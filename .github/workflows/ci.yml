name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.10'
      - name: Validate
        run: |
          python --version
          echo "Commit: $GITHUB_SHA"
          python -m py_compile $(find . -name "*.py" -not -path "./.git/*")
          test -f README.md || (echo "README.md отсутствует" && exit 1)
          test -s app.py || (echo "app.py отсутствует или пуст" && exit 1)

  unit_tests:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.10'
      - name: Run tests
        run: python -m unittest discover -s tests -v