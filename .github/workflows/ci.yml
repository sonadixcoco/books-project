name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.10'
      - name: Validate
        run: |
          python --version
          echo "Commit: $GITHUB_SHA"
          python -m py_compile $(find . -name "*.py" -not -path "./.git/*")
          test -f README.md || (echo "README.md отсутствует" && exit 1)
          test -s app.py || (echo "app.py отсутствует или пуст" && exit 1)

  unit_tests:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.10'
      - name: Run tests
        run: python -m unittest discover -s tests -v

  package:
    runs-on: ubuntu-latest
    needs: unit_tests
    steps:
      - uses: actions/checkout@v4
      - name: Сборка dist
        run: |
          mkdir -p dist
          cp books.py README.md Dockerfile books.json.example dist/
          {
            echo "CI_COMMIT_SHA=$GITHUB_SHA"
            echo "CI_PIPELINE_ID=$GITHUB_RUN_ID"
            echo "Files:"
            ls dist
          } > dist/manifest.txt
      - name: Загрузка артефакта
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist/
          retention-days: 7